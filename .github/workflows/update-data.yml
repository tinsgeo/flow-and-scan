name: Regenerate practice data

on:
  schedule:
    # every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate new data tables
        run: python scripts/generate_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "flow-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/associates.html data/orders.html
          git diff --cached --quiet || git commit -m "Regenerate practice data [automated]"
          git push
